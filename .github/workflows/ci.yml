name: CI

# Runs on every push and PR. The jobs are ordered so the fast, cheap signal
# (analyze + test) never waits on a platform build.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # --set-exit-if-changed so an unformatted file fails the build rather
        # than being silently reformatted.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The project's analysis_options.yaml promotes unused imports, dead code
        # and missing awaits to errors, so this is a real gate.
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=expanded --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  onnx-parity:
    name: ONNX model parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: pip install onnx numpy onnxruntime
      - run: flutter pub get

      # Retrain from scratch and confirm the committed model and fixture are
      # reproducible. Training is seeded, so a byte-identical model is expected;
      # a diff here means someone edited an asset by hand.
      - name: Retrain the on-device model
        run: python tools/train_router_model.py

      - name: Fail if the committed model is not reproducible
        run: |
          if ! git diff --quiet -- assets/models test/fixtures; then
            echo "::error::Regenerating the model produced a different artefact."
            git diff --stat -- assets/models test/fixtures
            exit 1
          fi

      # The parity test is what stops the Dart feature extractor drifting from
      # the Python reference the model was trained on.
      - name: Verify Dart/Python feature parity
        run: flutter test test/features/ai/hashing_vectorizer_parity_test.dart

  android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug build: the release build needs signing keys, which do not belong
      # in a public workflow. A debug APK still proves the whole native chain
      # links — ONNX Runtime and ML Kit both ship prebuilt .so files.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB (unsigned)
        # Catches R8/ProGuard problems that a debug build hides.
        run: flutter build appbundle --release
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign: signing needs a provisioning profile. This still compiles
      # every Swift/ObjC plugin and links the native ONNX and ML Kit frameworks,
      # which is the part worth verifying in CI.
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
