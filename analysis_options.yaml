# Curated strict analysis for EVDEkimi AI.
#
# We deliberately run stricter-than-default settings: the language settings below
# turn a class of runtime bugs into compile-time errors, which matters more in a
# codebase where an AI coding agent writes most of the first draft.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat hygiene problems as build failures so CI cannot go green with rot.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    invalid_annotation_target: ignore
    # Missing awaits are the single most common source of flaky async bugs.
    unawaited_futures: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: false
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # --- Async hygiene -----------------------------------------------------
    discarded_futures: false # too noisy for event handlers; unawaited_futures covers the risk
    await_only_futures: true

    # Off deliberately. Our constructors take public named parameters and assign
    # them to private fields (`AuthInterceptor({required AuthTokenDelegate
    # delegate}) : _delegate = delegate`). The rule suggests `this._delegate`,
    # which is legal Dart but makes the *argument name* library-private — so no
    # other file could pass it. Encapsulating the field wins over the lint.
    prefer_initializing_formals: false

    # --- Immutability / architecture ---------------------------------------
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_setters_without_getters: true
    one_member_abstracts: false # our ports are intentionally single-method
    prefer_mixin: true
    use_super_parameters: true

    # --- Readability -------------------------------------------------------
    always_put_required_named_parameters_first: false
    avoid_positional_boolean_parameters: true
    avoid_redundant_argument_values: true
    avoid_unused_constructor_parameters: true
    cascade_invocations: false
    directives_ordering: true
    join_return_with_assignment: false
    omit_local_variable_types: false
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    use_named_constants: true
    use_string_buffers: true

    # --- Flutter specific --------------------------------------------------
    avoid_unnecessary_containers: true
    use_colored_box: true
    use_decorated_box: true
    use_full_hex_values_for_flutter_colors: true
    sized_box_for_whitespace: true
