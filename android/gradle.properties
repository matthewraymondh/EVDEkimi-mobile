org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- SDK levels, declared once ---------------------------------------------
# Read by both android/build.gradle.kts and android/app/build.gradle.kts so the
# app module and every plugin module cannot disagree.
#
# compileSdk and its minor are separate on purpose: Google now publishes only
# minor-versioned platforms (android-37.0, android-37.1, ...), so a bare
# `compileSdk = 37` asks for a platform hash that does not exist. AGP 9 added
# compileSdkMinor for exactly this.
evdekimi.compileSdk=37
evdekimi.compileSdkMinor=0

# ML Kit text recognition and ONNX Runtime both need 21+; 26 additionally avoids
# the multidex and 16 KB-page workarounds older levels require.
evdekimi.minSdk=26

# --- Kotlin incremental compilation: off ------------------------------------
# Kotlin 2.3's Build Tools API cannot reliably close its incremental caches on
# Windows -- something keeps handles open on the .tab files and the compile task
# dies with:
#
#   Could not close incremental caches in <module>/kotlin/compileDebugKotlin/...
#     class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# Verified, not guessed: a clean build fails without this flag and succeeds with
# it, reproducibly, on several plugin modules.
#
# The cost is only local rebuild speed, and only on machines that did not need
# the workaround -- CI runners build cold, where incremental compilation buys
# nothing. Safe to delete if you are on Linux/macOS and want faster rebuilds.
kotlin.incremental=false
